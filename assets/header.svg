<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#18131e" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0f0d14" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070609" stop-opacity="1" />
    </radialGradient>

    <!-- Crimson Rose Accent Gradient -->
    <radialGradient id="roseAura" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#c48b9f" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#723249" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Silver Line Gradient -->
    <linearGradient id="silverLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c48b9f" stop-opacity="0" />
      <stop offset="25%" stop-color="#8e8299" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#f0eff5" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#8e8299" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c48b9f" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="etherealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softMist" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <style>
    .cinzel {
      font-family: 'Cinzel', 'Cinzel Decorative', 'Georgia', 'Playfair Display', serif;
      letter-spacing: 0.22em;
    }
    .fira {
      font-family: 'Fira Code', 'Courier New', monospace;
      letter-spacing: 0.16em;
    }
    .accent {
      fill: #c48b9f;
    }
    .silver {
      fill: #e8e6ed;
    }
    .dim {
      fill: #7d758a;
    }
  </style>

  <!-- Deep Background -->
  <rect width="880" height="260" rx="14" fill="#070609" />
  <rect width="880" height="260" rx="14" fill="url(#bgGlow)" />
  <ellipse cx="440" cy="115" rx="340" ry="95" fill="url(#roseAura)" filter="url(#softMist)" />

  <!-- Outer Ornate Filigree Frame -->
  <rect x="18" y="18" width="844" height="224" rx="8" fill="none" stroke="#25212c" stroke-width="1.2" />
  <rect x="25" y="25" width="830" height="210" rx="6" fill="none" stroke="#383142" stroke-width="0.8" stroke-dasharray="8 4" />

  <!-- Corner Flourishes -->
  <!-- Top-Left -->
  <path d="M 22 45 L 22 22 L 45 22" fill="none" stroke="#c48b9f" stroke-width="2" />
  <circle cx="22" cy="22" r="2.5" fill="#e8e6ed" />
  <path d="M 32 32 L 42 32 M 32 32 L 32 42" fill="none" stroke="#685d75" stroke-width="1" />

  <!-- Top-Right -->
  <path d="M 858 45 L 858 22 L 835 22" fill="none" stroke="#c48b9f" stroke-width="2" />
  <circle cx="858" cy="22" r="2.5" fill="#e8e6ed" />
  <path d="M 848 32 L 838 32 M 848 32 L 848 42" fill="none" stroke="#685d75" stroke-width="1" />

  <!-- Bottom-Left -->
  <path d="M 22 215 L 22 238 L 45 238" fill="none" stroke="#c48b9f" stroke-width="2" />
  <circle cx="22" cy="238" r="2.5" fill="#e8e6ed" />
  <path d="M 32 228 L 42 228 M 32 228 L 32 218" fill="none" stroke="#685d75" stroke-width="1" />

  <!-- Bottom-Right -->
  <path d="M 858 215 L 858 238 L 835 238" fill="none" stroke="#c48b9f" stroke-width="2" />
  <circle cx="858" cy="238" r="2.5" fill="#e8e6ed" />
  <path d="M 848 228 L 838 228 M 848 228 L 848 218" fill="none" stroke="#685d75" stroke-width="1" />

  <!-- Gothic Cathedral Vault Arch Hint in Center -->
  <path d="M 340 18 C 390 60, 440 75, 440 75 C 440 75, 490 60, 540 18" fill="none" stroke="#332c3d" stroke-width="1.2" opacity="0.6" />
  <path d="M 380 18 C 410 45, 440 55, 440 55 C 440 55, 470 45, 500 18" fill="none" stroke="#c48b9f" stroke-width="0.8" opacity="0.4" />

  <!-- Ambient Ethereal Stars / Crosses -->
  <g opacity="0.75">
    <text x="120" y="70" class="cinzel accent" font-size="11">✧</text>
    <text x="750" y="70" class="cinzel accent" font-size="11">✧</text>
    <text x="180" y="195" class="cinzel dim" font-size="10">✦</text>
    <text x="690" y="195" class="cinzel dim" font-size="10">✦</text>
    <text x="440" y="52" class="cinzel accent" font-size="14" text-anchor="middle">†</text>
  </g>

  <!-- Top Inscription -->
  <text x="440" y="78" class="cinzel dim" font-size="11" text-anchor="middle">
    𓆩  E T H E R E A L   D O M A I N   𓆪
  </text>

  <!-- Main Title: GHOST8-0-8 -->
  <text x="440" y="132" class="cinzel silver" font-size="34" font-weight="700" text-anchor="middle" filter="url(#etherealGlow)">
    G H O S T 8 - 0 - 8
  </text>

  <!-- Decorative Separator Line -->
  <line x1="220" y1="152" x2="660" y2="152" stroke="url(#silverLine)" stroke-width="1.2" />
  <circle cx="440" cy="152" r="3.5" fill="#c48b9f" />
  <circle cx="440" cy="152" r="1.5" fill="#f0eff5" />

  <!-- Subtitle Tagline -->
  <text x="440" y="180" class="fira accent" font-size="12" text-anchor="middle" opacity="0.9">
    // ARCHITECT OF CODE &amp; ATMOSPHERE
  </text>

  <!-- Bottom Coordinates / Status -->
  <text x="440" y="204" class="cinzel dim" font-size="10" text-anchor="middle">
    PARIS, FR  •  DARK AESTHETICS  •  NOCTURNAL ALCHEMY
  </text>
</svg>

